<svg class="data-stream" viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vertical fade for column markers -->
    <linearGradient id="streamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="82%"  stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dsRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dsHudBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#070b1c" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="dsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="dsSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <!-- Reusable status pills -->
    <symbol id="pillOK" overflow="visible">
      <rect x="0" y="-7" width="20" height="10" rx="2" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.6" stroke-width="0.5"/>
      <text x="10" y="1" text-anchor="middle" font-size="7" fill="#34d399" font-weight="700" letter-spacing="0.4">OK</text>
    </symbol>
    <symbol id="pillBLK" overflow="visible">
      <rect x="0" y="-7" width="32" height="10" rx="2" fill="#fb7185" fill-opacity="0.18" stroke="#fb7185" stroke-opacity="0.7" stroke-width="0.5"/>
      <text x="16" y="1" text-anchor="middle" font-size="7" fill="#fb7185" font-weight="700" letter-spacing="0.4">BLOCK</text>
    </symbol>
    <symbol id="pillWRN" overflow="visible">
      <rect x="0" y="-7" width="26" height="10" rx="2" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="0.5"/>
      <text x="13" y="1" text-anchor="middle" font-size="7" fill="#fbbf24" font-weight="700" letter-spacing="0.4">WARN</text>
    </symbol>
    <symbol id="pillAUD" overflow="visible">
      <rect x="0" y="-7" width="26" height="10" rx="2" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="0.5"/>
      <text x="13" y="1" text-anchor="middle" font-size="7" fill="#c4b5fd" font-weight="700" letter-spacing="0.4">AUDIT</text>
    </symbol>
    <style>
      .ds-ts   { fill:#67e8f9; opacity:.55; }
      .ds-msg  { fill:#67e8f9; opacity:.78; }
      .ds-msg-dim { fill:#67e8f9; opacity:.42; }
      .ds-msg-vio { fill:#c4b5fd; opacity:.82; }
      .ds-msg-grn { fill:#34d399; opacity:.85; }
      .ds-msg-amb { fill:#fbbf24; opacity:.85; }
      .ds-msg-red { fill:#fb7185; opacity:.9;  }
      .ds-hud-label { fill:#67e8f9; opacity:.55; }
      .ds-hud-val   { fill:#22d3ee; }
      .ds-hex { fill:#67e8f9; opacity:.06; }
      .ds-dot { fill:#a78bfa; opacity:.18; }
      .ds-rail-tick { stroke:#67e8f9; stroke-opacity:.35; stroke-width:.6; }
      .ds-cursor { fill:#22d3ee; }
      .ds-blink { animation: dsBlink 1.05s steps(2,end) infinite; }
      .ds-alert { animation: dsAlert 3.4s ease-in-out infinite; }
      .ds-alert-2 { animation: dsAlert 4.1s ease-in-out infinite; animation-delay:-1.2s; }
      .ds-alert-3 { animation: dsAlert 5.2s ease-in-out infinite; animation-delay:-2.6s; }
      .ds-pulse { animation: dsPulse 2.3s ease-in-out infinite; }
      .ds-scan  { animation: dsScan 6s linear infinite; }
      @keyframes dsBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes dsAlert {
        0%,86%,100% { opacity:.82; }
        90% { opacity:1; filter:url(#dsSoft); }
        93% { opacity:.6; }
        96% { opacity:1; }
      }
      @keyframes dsPulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
      @keyframes dsScan  { 0%{transform:translateY(0)} 100%{transform:translateY(420px)} }
      @media (prefers-reduced-motion: reduce) {
        .ds-blink, .ds-alert, .ds-alert-2, .ds-alert-3, .ds-pulse, .ds-scan { animation: none; }
      }
    </style>
  </defs>

  <!-- ====================== Background depth layers ====================== -->
  <g aria-hidden="true">
    <!-- subtle hex grid -->
    <g class="ds-hex" font-family="JetBrains Mono,monospace" font-size="8">
      <text x="14"  y="60">0x4af2</text>
      <text x="300" y="92">0xc017</text>
      <text x="20"  y="220">0x91be</text>
      <text x="285" y="260">0x2d4a</text>
      <text x="300" y="410">0x5a09</text>
    </g>
    <!-- faint dot field -->
    <g class="ds-dot">
      <circle cx="48" cy="120" r="1"/>
      <circle cx="312" cy="150" r="1"/>
      <circle cx="80" cy="300" r="1"/>
      <circle cx="280" cy="330" r="1"/>
      <circle cx="200" cy="390" r="1"/>
      <circle cx="120" cy="200" r="1"/>
    </g>
    <!-- soft ambient glow blobs -->
    <circle cx="60"  cy="120" r="60" fill="url(#dsGlow)" opacity=".35"/>
    <circle cx="300" cy="360" r="70" fill="url(#dsGlow)" opacity=".25"/>
  </g>

  <!-- ====================== Left timeline rail ====================== -->
  <g aria-hidden="true">
    <rect x="9" y="20" width="1" height="440" fill="url(#dsRail)"/>
    <g class="ds-rail-tick">
      <line x1="6" y1="60"  x2="13" y2="60"/>
      <line x1="6" y1="120" x2="13" y2="120"/>
      <line x1="6" y1="180" x2="13" y2="180"/>
      <line x1="6" y1="240" x2="13" y2="240"/>
      <line x1="6" y1="300" x2="13" y2="300"/>
      <line x1="6" y1="360" x2="13" y2="360"/>
      <line x1="6" y1="420" x2="13" y2="420"/>
    </g>
    <!-- moving scanline indicator -->
    <g class="ds-scan">
      <circle cx="9.5" cy="20" r="2.2" fill="#22d3ee"/>
      <circle cx="9.5" cy="20" r="4"   fill="#22d3ee" opacity=".25"/>
    </g>
  </g>

  <!-- ====================== Top HUD: agents / tool-calls counter ====================== -->
  <g aria-hidden="true" font-family="JetBrains Mono,monospace">
    <rect x="20" y="6" width="320" height="22" rx="3" fill="url(#dsHudBg)" stroke="#22d3ee" stroke-opacity=".22" stroke-width=".6"/>
    <circle cx="29" cy="17" r="2.4" fill="#34d399">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="37" y="20" font-size="8" class="ds-hud-label">LIVE</text>
    <text x="62" y="20" font-size="8" class="ds-hud-label">agents</text>
    <text x="96" y="20" font-size="9" class="ds-hud-val" font-weight="700">
      <tspan>1</tspan><tspan>,</tspan><tspan>284</tspan>
      <animate attributeName="opacity" values="1;.85;1" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="138" y="20" font-size="8" class="ds-hud-label">tool/s</text>
    <text x="170" y="20" font-size="9" class="ds-hud-val" font-weight="700">
      <tspan id="dsRate">3,8</tspan><tspan>72</tspan>
      <animate attributeName="opacity" values=".7;1;.7" dur="1.8s" repeatCount="indefinite"/>
    </text>
    <text x="212" y="20" font-size="8" class="ds-hud-label">blk</text>
    <text x="231" y="20" font-size="9" fill="#fb7185" font-weight="700">
      <tspan>0.42%</tspan>
      <animate attributeName="opacity" values=".55;1;.55" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="266" y="20" font-size="8" class="ds-hud-label">policy</text>
    <text x="298" y="20" font-size="9" class="ds-hud-val">v3.2.1</text>
    <text x="332" y="20" font-size="8" class="ds-cursor ds-blink">_</text>
  </g>

  <!-- ====================== Audit log columns ======================
       Three readable columns of rows, each driven by the existing
       .stream-col* CSS keyframe (translateY -150 -> 480). The inner
       groups use that animation so rows scroll vertically. Per-row
       layout: timestamp | status pill | message.
  =================================================================== -->
  <g font-family="JetBrains Mono,monospace" font-size="9">

    <!-- ----- Column A (left) ----- -->
    <g transform="translate(22 36)">
      <rect x="-2" y="0" width="1" height="430" fill="#22d3ee" fill-opacity=".07"/>
      <g class="stream-col">
        <!-- row 0 -->
        <g transform="translate(0 0)">
          <text class="ds-ts">12:42:08</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">mcp.list_tools</text>
        </g>
        <g transform="translate(0 18)">
          <text class="ds-ts">12:42:09</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">tools/call db.query</text>
        </g>
        <g transform="translate(0 36)" class="ds-alert">
          <text class="ds-ts">12:42:09</text>
          <use href="#pillBLK" x="46" y="0"/>
          <text x="82" class="ds-msg-red">prompt_injection</text>
        </g>
        <g transform="translate(0 54)">
          <text class="ds-ts">12:42:10</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">auth.scope=read</text>
        </g>
        <g transform="translate(0 72)">
          <text class="ds-ts">12:42:10</text>
          <use href="#pillAUD" x="46" y="0"/>
          <text x="76" class="ds-msg-vio">trace 9f3a..ce</text>
        </g>
        <g transform="translate(0 90)">
          <text class="ds-ts">12:42:11</text>
          <use href="#pillWRN" x="46" y="0"/>
          <text x="76" class="ds-msg-amb">rate_limit 80%</text>
        </g>
        <g transform="translate(0 108)">
          <text class="ds-ts">12:42:11</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">agent#42 -> tool#7</text>
        </g>
        <g transform="translate(0 126)">
          <text class="ds-ts">12:42:12</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">policy.v3.2 eval</text>
        </g>
        <g transform="translate(0 144)">
          <text class="ds-ts">12:42:12</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">fs.read /etc/cfg</text>
        </g>
        <g transform="translate(0 162)" class="ds-alert-2">
          <text class="ds-ts">12:42:13</text>
          <use href="#pillBLK" x="46" y="0"/>
          <text x="82" class="ds-msg-red">scope_escalate</text>
        </g>
        <g transform="translate(0 180)">
          <text class="ds-ts">12:42:13</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">mcp.handshake ok</text>
        </g>
        <g transform="translate(0 198)">
          <text class="ds-ts">12:42:14</text>
          <use href="#pillAUD" x="46" y="0"/>
          <text x="76" class="ds-msg-vio">sig 7c..a1 valid</text>
        </g>
        <g transform="translate(0 216)">
          <text class="ds-ts">12:42:14</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">http.get api/v1</text>
        </g>
      </g>
    </g>

    <!-- ----- Column B (middle) ----- -->
    <g transform="translate(135 36)">
      <rect x="-2" y="0" width="1" height="430" fill="#a78bfa" fill-opacity=".07"/>
      <g class="stream-col stream-col-3">
        <g transform="translate(0 0)">
          <text class="ds-ts">12:42:08</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">guardrail.eval</text>
        </g>
        <g transform="translate(0 18)" class="ds-alert-3">
          <text class="ds-ts">12:42:08</text>
          <use href="#pillBLK" x="46" y="0"/>
          <text x="82" class="ds-msg-red">data_exfil deny</text>
        </g>
        <g transform="translate(0 36)">
          <text class="ds-ts">12:42:09</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">kms.decrypt k#19</text>
        </g>
        <g transform="translate(0 54)">
          <text class="ds-ts">12:42:09</text>
          <use href="#pillAUD" x="46" y="0"/>
          <text x="76" class="ds-msg-vio">log -&gt; siem</text>
        </g>
        <g transform="translate(0 72)">
          <text class="ds-ts">12:42:10</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">vault.lease 30s</text>
        </g>
        <g transform="translate(0 90)">
          <text class="ds-ts">12:42:10</text>
          <use href="#pillWRN" x="46" y="0"/>
          <text x="76" class="ds-msg-amb">token near-exp</text>
        </g>
        <g transform="translate(0 108)">
          <text class="ds-ts">12:42:11</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">tools/call email</text>
        </g>
        <g transform="translate(0 126)">
          <text class="ds-ts">12:42:11</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">approve human#1</text>
        </g>
        <g transform="translate(0 144)">
          <text class="ds-ts">12:42:12</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">plan -&gt; act</text>
        </g>
        <g transform="translate(0 162)">
          <text class="ds-ts">12:42:12</text>
          <use href="#pillAUD" x="46" y="0"/>
          <text x="76" class="ds-msg-vio">replay snap#88</text>
        </g>
        <g transform="translate(0 180)" class="ds-alert">
          <text class="ds-ts">12:42:13</text>
          <use href="#pillBLK" x="46" y="0"/>
          <text x="82" class="ds-msg-red">tool spoof block</text>
        </g>
        <g transform="translate(0 198)">
          <text class="ds-ts">12:42:13</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">retry backoff 2x</text>
        </g>
        <g transform="translate(0 216)">
          <text class="ds-ts">12:42:14</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">graph.commit ok</text>
        </g>
      </g>
    </g>

    <!-- ----- Column C (right) ----- -->
    <g transform="translate(248 36)">
      <rect x="-2" y="0" width="1" height="430" fill="#22d3ee" fill-opacity=".07"/>
      <g class="stream-col stream-col-5">
        <g transform="translate(0 0)">
          <text class="ds-ts">12:42:08</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">mcp.ping rtt 12</text>
        </g>
        <g transform="translate(0 18)">
          <text class="ds-ts">12:42:09</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">tools/call k8s.list</text>
        </g>
        <g transform="translate(0 36)">
          <text class="ds-ts">12:42:09</text>
          <use href="#pillWRN" x="46" y="0"/>
          <text x="76" class="ds-msg-amb">drift cfg#11</text>
        </g>
        <g transform="translate(0 54)">
          <text class="ds-ts">12:42:10</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">iam.scope=ro</text>
        </g>
        <g transform="translate(0 72)" class="ds-alert-2">
          <text class="ds-ts">12:42:10</text>
          <use href="#pillBLK" x="46" y="0"/>
          <text x="82" class="ds-msg-red">jailbreak attempt</text>
        </g>
        <g transform="translate(0 90)">
          <text class="ds-ts">12:42:11</text>
          <use href="#pillAUD" x="46" y="0"/>
          <text x="76" class="ds-msg-vio">key rotate r#7</text>
        </g>
        <g transform="translate(0 108)">
          <text class="ds-ts">12:42:11</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">agent#108 dispatch</text>
        </g>
        <g transform="translate(0 126)">
          <text class="ds-ts">12:42:12</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">cspm.scan pass</text>
        </g>
        <g transform="translate(0 144)">
          <text class="ds-ts">12:42:12</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg">iso27001 ctrl#4.2</text>
        </g>
        <g transform="translate(0 162)">
          <text class="ds-ts">12:42:13</text>
          <use href="#pillWRN" x="46" y="0"/>
          <text x="76" class="ds-msg-amb">unusual tool seq</text>
        </g>
        <g transform="translate(0 180)">
          <text class="ds-ts">12:42:13</text>
          <use href="#pillOK" x="46" y="0"/>
          <text x="72" class="ds-msg-dim">budget ok 0.42$</text>
        </g>
        <g transform="translate(0 198)">
          <text class="ds-ts">12:42:14</text>
          <use href="#pillAUD" x="46" y="0"/>
          <text x="76" class="ds-msg-vio">attest sig ok</text>
        </g>
        <g transform="translate(0 216)" class="ds-alert">
          <text class="ds-ts">12:42:14</text>
          <use href="#pillBLK" x="46" y="0"/>
          <text x="82" class="ds-msg-red">policy.v3.2 deny</text>
        </g>
      </g>
    </g>

    <!-- ====================== Slim secondary tickers (column markers) ======================
         Three thin vertical "binary" tickers behind the main columns, reusing the
         remaining .stream-col-* classes (2, 4, 6) so all six animations stay alive.
    ============================================================================== -->
    <g font-size="8" text-anchor="middle" fill="url(#streamGrad)" opacity=".5">
      <g transform="translate(128 0)">
        <g class="stream-col stream-col-2">
          <text y="20">10</text><text y="56">{}</text><text y="92">→</text>
          <text y="128">01</text><text y="164">v3</text><text y="200">11</text>
        </g>
      </g>
      <g transform="translate(242 0)">
        <g class="stream-col stream-col-4">
          <text y="14">01</text><text y="50">k8s</text><text y="86">10</text>
          <text y="122">→</text><text y="158">v3</text><text y="194">{}</text>
        </g>
      </g>
      <!-- stream-col-6 carried by the blinking HUD cursor below -->
      <g transform="translate(0 0)">
        <g class="stream-col stream-col-6" opacity="0"><text y="0">.</text></g>
      </g>
    </g>
  </g>

  <!-- ====================== Bottom status strip ====================== -->
  <g aria-hidden="true" font-family="JetBrains Mono,monospace">
    <rect x="20" y="452" width="320" height="20" rx="3" fill="url(#dsHudBg)" stroke="#a78bfa" stroke-opacity=".22" stroke-width=".6"/>
    <text x="28" y="466" font-size="8" class="ds-hud-label">region</text>
    <text x="56" y="466" font-size="8" class="ds-hud-val">eu-west-3</text>
    <text x="108" y="466" font-size="8" class="ds-hud-label">mTLS</text>
    <text x="130" y="466" font-size="8" fill="#34d399">on</text>
    <text x="146" y="466" font-size="8" class="ds-hud-label">attest</text>
    <text x="172" y="466" font-size="8" fill="#34d399">sigstore</text>
    <text x="216" y="466" font-size="8" class="ds-hud-label">q</text>
    <text x="226" y="466" font-size="8" class="ds-hud-val">
      <tspan>184</tspan>
      <animate attributeName="opacity" values=".55;1;.55" dur="2.1s" repeatCount="indefinite"/>
    </text>
    <text x="248" y="466" font-size="8" class="ds-hud-label">drift</text>
    <text x="270" y="466" font-size="8" fill="#fbbf24">0.03</text>
    <text x="294" y="466" font-size="8" class="ds-hud-label">ok</text>
    <circle cx="312" cy="463" r="2.4" fill="#34d399" class="ds-pulse"/>
    <text x="322" y="466" font-size="8" class="ds-cursor ds-blink">_</text>
  </g>
</svg>
