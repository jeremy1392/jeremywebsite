<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure conversation gateway">
  <defs>
    <!-- Reusable gradients -->
    <linearGradient id="cvStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cvStrokeRev" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cvCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="cvCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a0f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0f24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cvScanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft blur for glow layers -->
    <filter id="cvBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="cvBlurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <!-- Fingerprint mask: limits scan light to inside the print -->
    <clipPath id="cvPrintClip">
      <g transform="translate(100 122)">
        <path d="M -22 6 a 22 26 0 0 1 44 0 v 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M -16 4 a 16 20 0 0 1 32 0 v 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M -10 2 a 10 14 0 0 1 20 0 v 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M -4 0 a 4 8 0 0 1 8 0 v 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M -22 14 q 22 -6 44 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </clipPath>

    <!-- Hex vault door path -->
    <path id="cvHex" d="M100 38 L160 72 L160 144 L100 178 L40 144 L40 72 Z"/>
  </defs>

  <style>
    .cv-pulse        { transform-origin: 100px 122px; animation: cvPulse 3.6s ease-in-out infinite; }
    .cv-pulse-d      { transform-origin: 100px 122px; animation: cvPulse 3.6s ease-in-out infinite; animation-delay: 1.2s; }
    .cv-rotate-cw    { transform-origin: 100px 108px; animation: cvRot 24s linear infinite; }
    .cv-rotate-ccw   { transform-origin: 100px 108px; animation: cvRot 18s linear infinite reverse; }
    .cv-orbit        { transform-origin: 100px 108px; animation: cvRot 8s linear infinite; }
    .cv-breathe      { transform-origin: 100px 122px; animation: cvBreathe 5s ease-in-out infinite; }
    .cv-flicker      { animation: cvFlicker 4.2s ease-in-out infinite; }
    .cv-stamp        { transform-origin: 100px 200px; animation: cvStamp 5.5s ease-in-out infinite; }
    .cv-stamp-ring   { transform-origin: 100px 200px; animation: cvStampRing 5.5s ease-out infinite; }
    .cv-handshake    { stroke-dasharray: 188; stroke-dashoffset: 188; animation: cvHandshake 4.8s ease-in-out infinite; }
    .cv-node-pop     { transform-origin: center; animation: cvNodePop 4.8s ease-in-out infinite; transform-box: fill-box; }

    @keyframes cvPulse  { 0%,100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.18); opacity: 0; } }
    @keyframes cvRot    { to { transform: rotate(360deg); } }
    @keyframes cvBreathe{ 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes cvFlicker{ 0%,40%,100% { opacity: 0.85; } 20% { opacity: 0.35; } 60% { opacity: 1; } }
    @keyframes cvStamp  { 0%,55% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 70%,95% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes cvStampRing { 0%,55% { transform: scale(0.4); opacity: 0; } 62% { transform: scale(1.6); opacity: 0.8; } 80%,100% { transform: scale(2.2); opacity: 0; } }
    @keyframes cvHandshake { 0% { stroke-dashoffset: 188; } 55% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0.15; } }
    @keyframes cvNodePop { 0%,20% { transform: scale(0.6); opacity: 0.4; } 45%,80% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.6; } }

    @media (prefers-reduced-motion: reduce) {
      .cv-pulse,.cv-pulse-d,.cv-rotate-cw,.cv-rotate-ccw,.cv-orbit,
      .cv-breathe,.cv-flicker,.cv-stamp,.cv-stamp-ring,
      .cv-handshake,.cv-node-pop { animation: none !important; }
      .cv-handshake { stroke-dashoffset: 0; }
      .cv-stamp { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- ============ AURA / BACKDROP ============ -->
  <circle cx="100" cy="118" r="92" fill="url(#cvAura)"/>

  <!-- Concentric pulse halos (elevated motif) -->
  <g fill="none" stroke-width="1.1">
    <circle class="cv-pulse"   cx="100" cy="122" r="62" stroke="#22d3ee"/>
    <circle class="cv-pulse-d" cx="100" cy="122" r="62" stroke="#a78bfa"/>
  </g>

  <!-- ============ OUTER ROTATING RING (data ticks) ============ -->
  <g class="cv-rotate-cw" opacity="0.85">
    <circle cx="100" cy="108" r="86" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="0.8"/>
    <g stroke="url(#cvStroke)" stroke-width="1.4" stroke-linecap="round">
      <line x1="100" y1="22"  x2="100" y2="30"/>
      <line x1="100" y1="186" x2="100" y2="194"/>
      <line x1="14"  y1="108" x2="22"  y2="108"/>
      <line x1="178" y1="108" x2="186" y2="108"/>
      <line x1="39"  y1="47"  x2="44"  y2="52"/>
      <line x1="156" y1="164" x2="161" y2="169"/>
      <line x1="161" y1="47"  x2="156" y2="52"/>
      <line x1="44"  y1="164" x2="39"  y2="169"/>
    </g>
    <!-- Travelling node along the ring -->
    <circle cx="186" cy="108" r="2.4" fill="#67e8f9"/>
  </g>

  <!-- Inner counter-rotating arc (TLS handshake style) -->
  <g class="cv-rotate-ccw" opacity="0.9">
    <path d="M 100 38 A 70 70 0 0 1 170 108" fill="none" stroke="url(#cvStrokeRev)"
          stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 8"/>
    <path d="M 100 178 A 70 70 0 0 1 30 108" fill="none" stroke="url(#cvStroke)"
          stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 10"/>
  </g>

  <!-- ============ HEX VAULT DOOR ============ -->
  <g class="cv-breathe">
    <!-- Outer hex frame -->
    <use href="#cvHex" fill="#0a0f24" stroke="url(#cvStroke)" stroke-width="2"/>
    <use href="#cvHex" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="0.6"
         transform="translate(100 108) scale(0.92) translate(-100 -108)"/>

    <!-- Inner core glow -->
    <circle cx="100" cy="122" r="44" fill="url(#cvCore)" filter="url(#cvBlur)"/>
    <circle cx="100" cy="122" r="42" fill="none" stroke="url(#cvStroke)" stroke-width="1.1"/>
    <circle cx="100" cy="122" r="36" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="0.6"/>

    <!-- ============ FINGERPRINT ============ -->
    <g transform="translate(100 122)" stroke="#67e8f9" stroke-width="1.4" fill="none"
       stroke-linecap="round" opacity="0.85">
      <path d="M -22 6 a 22 26 0 0 1 44 0 v 10"/>
      <path d="M -16 4 a 16 20 0 0 1 32 0 v 12"/>
      <path d="M -10 2 a 10 14 0 0 1 20 0 v 14"/>
      <path d="M -4 0  a 4 8  0 0 1 8 0  v 14"/>
      <path d="M -22 14 q 22 -6 44 0"/>
    </g>

    <!-- Scanning beam clipped to fingerprint -->
    <g clip-path="url(#cvPrintClip)">
      <rect x="60" y="100" width="80" height="6" fill="url(#cvScanGrad)" filter="url(#cvBlurSm)">
        <animate attributeName="y" values="100;148;100" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- TLS handshake progress arc around the core -->
    <circle class="cv-handshake" cx="100" cy="122" r="30" fill="none"
            stroke="#34d399" stroke-width="1.8" stroke-linecap="round"
            transform="rotate(-90 100 122)"/>
  </g>

  <!-- ============ ORBITING KEY TOKEN ============ -->
  <g class="cv-orbit">
    <g transform="translate(170 108)">
      <circle r="6" fill="#0a0f24" stroke="url(#cvStroke)" stroke-width="1.2"/>
      <circle r="2.2" fill="#fbbf24"/>
      <rect x="-1.2" y="4" width="2.4" height="9" fill="url(#cvCyan)"/>
      <rect x="1.2"  y="9" width="3"   height="1.6" fill="#67e8f9"/>
      <rect x="1.2"  y="11.5" width="2" height="1.4" fill="#67e8f9"/>
    </g>
  </g>

  <!-- ============ NODE GRAPH (secure mesh, bottom) ============ -->
  <g transform="translate(100 210)">
    <!-- connecting lines -->
    <g stroke="url(#cvStroke)" stroke-width="1" opacity="0.7">
      <line x1="-34" y1="0" x2="-12" y2="-10"/>
      <line x1="-12" y1="-10" x2="12" y2="-10"/>
      <line x1="12"  y1="-10" x2="34" y2="0"/>
      <line x1="-34" y1="0"   x2="34" y2="0"  stroke-dasharray="2 3" opacity="0.4"/>
    </g>
    <!-- nodes -->
    <g fill="#0a0f24" stroke="url(#cvStroke)" stroke-width="1.2">
      <circle class="cv-node-pop" cx="-34" cy="0"   r="3.2"/>
      <circle class="cv-node-pop" cx="-12" cy="-10" r="3.2" style="animation-delay:.4s"/>
      <circle class="cv-node-pop" cx="12"  cy="-10" r="3.2" style="animation-delay:.8s"/>
      <circle class="cv-node-pop" cx="34"  cy="0"   r="3.2" style="animation-delay:1.2s"/>
    </g>
    <!-- center "verified" stamp + ring -->
    <circle class="cv-stamp-ring" cx="0" cy="-10" r="6"
            fill="none" stroke="#34d399" stroke-width="1.4"/>
    <g class="cv-stamp">
      <circle cx="0" cy="-10" r="6" fill="#0a0f24" stroke="#34d399" stroke-width="1.4"/>
      <path d="M -2.6 -10 l 2 2 l 3.4 -3.6" fill="none" stroke="#34d399"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Side data bits (subtle ambient telemetry) -->
  <g class="cv-flicker" fill="#67e8f9" opacity="0.6">
    <rect x="16"  y="74"  width="4" height="1.4"/>
    <rect x="16"  y="80"  width="7" height="1.4"/>
    <rect x="16"  y="86"  width="3" height="1.4"/>
    <rect x="180" y="138" width="4" height="1.4"/>
    <rect x="178" y="144" width="6" height="1.4"/>
    <rect x="181" y="150" width="3" height="1.4"/>
  </g>

  <!-- Hex corner accents -->
  <g fill="url(#cvStroke)">
    <circle cx="100" cy="38"  r="2.2"/>
    <circle cx="160" cy="72"  r="2.2"/>
    <circle cx="160" cy="144" r="2.2"/>
    <circle cx="100" cy="178" r="2.2"/>
    <circle cx="40"  cy="144" r="2.2"/>
    <circle cx="40"  cy="72"  r="2.2"/>
  </g>
</svg>
